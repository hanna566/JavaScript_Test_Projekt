<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Taschenrechner</title>
</head>
<body>
    <!--<label for="number1">Nummer 1</label>

    <!--Taschenrechner--> 
    <h1>-- Taschenrechner --</h1>

    <div class="eingabe">
        <output class="input" id="output" type="number" ClickButton ()>
    </div>


    <div class="board">
        <div class="zeichen">
            <button id="plus">+</button>
            <button id="minus">-</button>
            <button id="mal">*</button>
            <button id="teil">/</button>
        </div>
        <div class="number">
            <Button id="Btn1" onclick="ClickButton1 ()">1</Button>
            <Button id="Btn2" onclick="ClickButton2 ()">2</Button>
            <Button id="Btn3" onclick="ClickButton3 ()">3</Button>
            <Button id="Btn4" onclick="ClickButton4 ()">4</Button>
            <Button id="Btn5" onclick="ClickButton5 ()">5</Button>
            <Button id="Btn6" onclick="ClickButton6 ()">6</Button>
            <Button id="Btn7" onclick="ClickButton7 ()">7</Button>
            <Button id="Btn8" onclick="ClickButton8 ()">8</Button>
            <Button id="Btn9" onclick="ClickButton9 ()">9</Button>
        </div>
    </div>





    <script src="script.js" ></script>
</body>
</html>
