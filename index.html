<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Taschenrechner</title>
</head>
<body>
    <!--<label for="number1">Nummer 1</label>
    <input type="number" id="number1">
    <button id="btn" onclick="ClickButton()">Click Me</button>
    <h1 id="text">Test</h1>-->

    <!--Taschenrechner--> 
    <h1>-- Taschenrechner --</h1>

    <div class="eingabe">
        <output class="onput" id="output" type="text" ClickButton ()></output>
    </div>

    <div class="board">
        <div class="zeichen">
            <button id="plus" onclick="ClickButton('+')">+</button>
            <button id="minus" onclick="ClickButton('-')">-</button>
            <button id="mal" onclick="ClickButton('*')">*</button>
            <button id="teil" onclick="ClickButton('/')">/</button>
            <button id="clear" onclick="remove()">DEL</button>
        </div>
        <div class="number">
            <button id="Btn1" onclick="ClickButton('1')">1</button>
            <button id="Btn2" onclick="ClickButton('2')">2</button>
            <button id="Btn3" onclick="ClickButton('3')">3</button>
            <button id="Btn4" onclick="ClickButton('4')">4</button>
            <button id="Btn5" onclick="ClickButton('5')">5</button>
            <button id="Btn6" onclick="ClickButton('6')">6</button>
            <button id="Btn7" onclick="ClickButton('7')">7</button>
            <button id="Btn8" onclick="ClickButton('8')">8</button>
            <button id="Btn9" onclick="ClickButton('9')">9</button>
            <button id="Btn0" onclick="ClickButton('0')">0</button>
            <button id="point" onclick="ClickButton('.')">.</button>
            <button id="gleich" onclick="split()">=</button>
        </div>
    </div>

    <script src="script.js" ></script>
</body>
</html>
